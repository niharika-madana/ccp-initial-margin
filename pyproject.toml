[project]
name = "ccpmargin"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "pandas", "pyarrow", "duckdb", "pydantic>=2", "pyyaml", "wrds", "dagster",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100